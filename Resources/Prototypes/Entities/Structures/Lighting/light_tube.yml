# Light Tubes

# Light Tube, Always Powered
- type: entity
  parent: AlwaysPoweredWallLight
  id: RMCLightFixtureAlwaysPowered
  name: light fixture
  description: A light.
  suffix: Always powered
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _PSurvival/Structures/Wallmounts/Lighting/light_tube.rsi
    state: tube1
    layers:
    - state: tube1
      map: ["enum.PoweredLightLayers.Base"]
  - type: PointLight
    color: "#FFEFD2"
    energy: 1
    radius: 10
    softness: 1
    offset: "0, 0.5"
  - type: PoweredLightVisuals
    spriteStateMap:
      Empty: tube-empty
      Off: tube0
      On: tube1
      Broken: tube-broken
      Burned: tube-burned
  - type: AmbientSound
    volume: -8
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fluorescent_light_buzz.ogg

- type: entity
  parent: RMCLightFixtureAlwaysPowered
  id: RMCLightFixtureAlwaysPoweredOffset
  suffix: Always powered
  components:
  - type: Sprite
    sprite: _PSurvival/Structures/Wallmounts/LightingOffset/light_tube.rsi
    state: tube1

- type: entity
  parent: RMCLightFixtureAlwaysPowered
  id: RMCLightFixtureBlueAlwaysPowered
  suffix: Always powered, DO NOT MAP
  components:
  - type: Sprite
    state: btube1
    layers:
    - state: btube1
