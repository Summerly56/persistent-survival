# Light Tube
- type: entity
  parent: RMCLightFixtureEmpty
  id: RMCLightFixture
  suffix: DO NOT MAP
  components:
  - type: Sprite
    state: tube1
  - type: PointLight
    enabled: true
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -15
    range: 2
    sound:
      path: /Audio/Ambience/Objects/light_hum.ogg
  - type: DeviceLinkSink
    ports:
    - On
    - Off
    - Toggle

